name: Build APK
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        env:
          # Neu chua dat secrets thi build dung mat khau mac dinh (xem app/build.gradle.kts)
          GUARD_STORE_PASSWORD: ${{ secrets.GUARD_STORE_PASSWORD }}
          GUARD_KEY_ALIAS: ${{ secrets.GUARD_KEY_ALIAS }}
          GUARD_KEY_PASSWORD: ${{ secrets.GUARD_KEY_PASSWORD }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk GeminiGuard-v2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiGuard-apk
          path: GeminiGuard-v2.0.apk
      - name: Publish release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GeminiGuard-v2.0.apk
