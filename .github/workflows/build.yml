name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cache Gradle; build dung wrapper trong repo (gradle/wrapper/gradle-wrapper.jar).
      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          # Neu chua dat secrets thi build dung mat khau mac dinh (xem app/build.gradle.kts).
          # Dat secrets de ky bang keystore rieng; bo trong van cai de len ban cu duoc.
          GUARD_STORE_PASSWORD: ${{ secrets.GUARD_STORE_PASSWORD }}
          GUARD_KEY_ALIAS: ${{ secrets.GUARD_KEY_ALIAS }}
          GUARD_KEY_PASSWORD: ${{ secrets.GUARD_KEY_PASSWORD }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GeminiGuard-v2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiGuard-apk
          path: GeminiGuard-v2.0.apk
          if-no-files-found: error

      - name: Publish release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GeminiGuard-v2.0.apk
